services :
  # guinicorn
  web-server: 
    image: nginx:stable-alpine3.23
    ports:
      - "8080:80"
    volumes:
      - ./templates:/usr/share/nginx/html/templates:ro
      - ./static:/usr/share/nginx/html/satatic:ro
      - .docker/nginx.conf:/etc/nginx/conf.d/default.conf
  # nginx
  backend:
    build: .
    volumes:
      - ./main.py:/app/main.py
    # ports:
    #   - "8000:8000"