<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новости</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <!-- Внешний CSS (все стили перенесены сюда) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Приветствие и ссылки -->
        <div>
            <p>Привет, {{ username }}!</p>
            <a href="/logout">Выйти</a>
            <a href="/login">Войти</a>
        </div>

        <!-- Заголовок -->
        <h1>Новости</h1>

        <!-- Таблица новостей -->
        <div class="news-table-wrapper">
            <table class="news-table" id="newsTable">
                <thead>
                    <tr>
                        <th>Заголовок</th>
                        <th>Текст новости</th>
                        <th>Автор</th>
                        <th>Дата</th>
                    </tr>
                </thead>
                <tbody id="newsTableBody">
                    <!-- Данные будут добавлены через JS -->
                </tbody>
            </table>
        </div>

        <!-- Счётчик новостей -->
        <div class="counter" id="newsCounter"></div>
    </div>

    <!-- Точка монтирования React -->
    <div id="root"></div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='master.js') }}"></script>
</body>
</html>
